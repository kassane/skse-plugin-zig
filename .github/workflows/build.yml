name: Zig

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@main
      - uses: zed-industries/setup-zig@node24
        with:
          version: 0.17.1

      - name: Tests
        run: zig build test --summary all -freference-trace
      - name: Build
        working-directory: examples
        run: |
          zig build --build-file $PWD/basic/build.zig --summary all -freference-trace
          zig build --build-file $PWD/report/build.zig --summary all -freference-trace